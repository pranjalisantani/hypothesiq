<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="100%" height="auto">
  <defs>
    <linearGradient id="stack-card-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="160" rx="12" fill="#080b11"/>
  <rect x="0.5" y="0.5" width="1199" height="159" rx="11.5" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Top Title -->
  <text x="30" y="28" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#38bdf8" letter-spacing="2">TECHNOLOGY STACK // PRODUCTION ENVIRONMENT</text>
  <text x="1170" y="28" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#64748b" text-anchor="end">DETERMINISTIC COMPILATION</text>
  <line x1="30" y1="40" x2="1170" y2="40" stroke="#1e293b" stroke-width="1"/>

  <!-- 6 Tech Cards (W: 175, H: 92, Gap: 18, Total width: 6*175 + 5*18 = 1050 + 90 = 1140, Start X: 30) -->

  <!-- 1. React 19 -->
  <g transform="translate(30, 52)">
    <rect width="175" height="92" rx="6" fill="#0c1017" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="175" height="2" rx="1" fill="#38bdf8"/>
    <text x="16" y="28" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="10" fill="#64748b">CORE UI</text>
    <text x="16" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">React 19</text>
    <text x="16" y="74" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="10" fill="#38bdf8">Component Tree</text>
  </g>

  <!-- 2. Vite 8 -->
  <g transform="translate(223, 52)">
    <rect width="175" height="92" rx="6" fill="#0c1017" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="175" height="2" rx="1" fill="#a855f7"/>
    <text x="16" y="28" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="10" fill="#64748b">BUNDLER</text>
    <text x="16" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Vite 8</text>
    <text x="16" y="74" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="10" fill="#a855f7">Rollup Engine</text>
  </g>

  <!-- 3. Tailwind CSS 4 -->
  <g transform="translate(416, 52)">
    <rect width="175" height="92" rx="6" fill="#0c1017" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="175" height="2" rx="1" fill="#00e5ff"/>
    <text x="16" y="28" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="10" fill="#64748b">STYLING</text>
    <text x="16" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Tailwind 4</text>
    <text x="16" y="74" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="10" fill="#00e5ff">Utility Engine</text>
  </g>

  <!-- 4. Lucide React -->
  <g transform="translate(609, 52)">
    <rect width="175" height="92" rx="6" fill="#0c1017" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="175" height="2" rx="1" fill="#f59e0b"/>
    <text x="16" y="28" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="10" fill="#64748b">ICONS</text>
    <text x="16" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Lucide React</text>
    <text x="16" y="74" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="10" fill="#f59e0b">Vector Glyphs</text>
  </g>

  <!-- 5. HTML5 Canvas -->
  <g transform="translate(802, 52)">
    <rect width="175" height="92" rx="6" fill="#0c1017" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="175" height="2" rx="1" fill="#f8fafc"/>
    <text x="16" y="28" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="10" fill="#64748b">GRAPHICS</text>
    <text x="16" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">HTML5 Canvas</text>
    <text x="16" y="74" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="10" fill="#f8fafc">2D Context</text>
  </g>

  <!-- 6. GitHub Actions -->
  <g transform="translate(995, 52)">
    <rect width="175" height="92" rx="6" fill="#0c1017" stroke="#1e293b" stroke-width="1"/>
    <rect x="0" y="0" width="175" height="2" rx="1" fill="#10b981"/>
    <text x="16" y="28" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="10" fill="#64748b">DELIVERY</text>
    <text x="16" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">GH Actions</text>
    <text x="16" y="74" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="10" fill="#10b981">CI/CD Deploy</text>
  </g>
</svg>
