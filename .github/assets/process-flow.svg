<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="auto">
  <defs>
    <radialGradient id="card-glow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07090e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stream-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0a84ff"/>
    </linearGradient>
    <pattern id="dot-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" fill-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="14" fill="#080b11"/>
  <rect width="1200" height="320" rx="14" fill="url(#dot-grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="13.5" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Top Title Bar -->
  <text x="40" y="38" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#38bdf8" letter-spacing="2">EMPIRICAL INVESTIGATION METHODOLOGY</text>
  <text x="1160" y="38" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#64748b" text-anchor="end">PIPELINE::01-03</text>
  <line x1="40" y1="52" x2="1160" y2="52" stroke="#1e293b" stroke-width="1"/>

  <!-- Connector Line 1 to 2 -->
  <line x1="390" y1="180" x2="445" y2="180" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="450,180 442,176 442,184" fill="#38bdf8"/>

  <!-- Connector Line 2 to 3 -->
  <line x1="775" y1="180" x2="830" y2="180" stroke="#00e5ff" stroke-width="2" stroke-dasharray="6 4"/>
  <polygon points="835,180 827,176 827,184" fill="#00e5ff"/>

  <!-- ==================== STATION 1: THINK ==================== -->
  <g transform="translate(40, 75)">
    <!-- Box -->
    <rect width="345" height="210" rx="10" fill="#0c1018" stroke="#1e293b" stroke-width="1.2"/>
    <rect width="345" height="210" rx="10" fill="url(#card-glow)"/>
    <rect x="0" y="0" width="345" height="3" rx="1.5" fill="#38bdf8"/>

    <!-- Station Identifier -->
    <text x="24" y="34" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.5">01 // HYPOTHESIS</text>
    <text x="24" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="2">THINK</text>

    <!-- Subtitle -->
    <text x="24" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Formulate models &amp; isolate unknowns</text>

    <!-- Bullets -->
    <g transform="translate(24, 120)" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#cbd5e1">
      <circle cx="4" cy="5" r="2.5" fill="#38bdf8"/>
      <text x="18" y="9">Anomaly isolation &amp; scoping</text>
      <circle cx="4" cy="30" r="2.5" fill="#38bdf8"/>
      <text x="18" y="34">Boundary condition modeling</text>
      <circle cx="4" cy="55" r="2.5" fill="#38bdf8"/>
      <text x="18" y="59">Falsifiable test formulation</text>
    </g>

    <!-- Corner Icon Glyph: Radar Aperture -->
    <g transform="translate(295, 48)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#1e293b" stroke-width="1"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3"/>
      <circle cx="0" cy="0" r="4" fill="#38bdf8"/>
      <line x1="-22" y1="0" x2="22" y2="0" stroke="#1e293b" stroke-width="1"/>
      <line x1="0" y1="-22" x2="0" y2="22" stroke="#1e293b" stroke-width="1"/>
    </g>
  </g>

  <!-- ==================== STATION 2: TEST ==================== -->
  <g transform="translate(425, 75)">
    <!-- Box -->
    <rect width="345" height="210" rx="10" fill="#0c1018" stroke="#1e293b" stroke-width="1.2"/>
    <rect width="345" height="210" rx="10" fill="url(#card-glow)"/>
    <rect x="0" y="0" width="345" height="3" rx="1.5" fill="#f8fafc"/>

    <!-- Station Identifier -->
    <text x="24" y="34" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="12" font-weight="700" fill="#f8fafc" letter-spacing="1.5">02 // VERIFICATION</text>
    <text x="24" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="2">TEST</text>

    <!-- Subtitle -->
    <text x="24" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Execute experiments &amp; inspect systems</text>

    <!-- Bullets -->
    <g transform="translate(24, 120)" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#cbd5e1">
      <circle cx="4" cy="5" r="2.5" fill="#f8fafc"/>
      <text x="18" y="9">Controlled execution cycles</text>
      <circle cx="4" cy="30" r="2.5" fill="#f8fafc"/>
      <text x="18" y="34">Runtime state &amp; memory inspect</text>
      <circle cx="4" cy="55" r="2.5" fill="#f8fafc"/>
      <text x="18" y="59">Empirical telemetry capture</text>
    </g>

    <!-- Corner Icon Glyph: Oscilloscope Pulse -->
    <g transform="translate(295, 48)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#1e293b" stroke-width="1"/>
      <path d="M -16 0 L -8 0 L -4 -12 L 2 14 L 6 -6 L 10 0 L 16 0" fill="none" stroke="#f8fafc" stroke-width="1.5"/>
    </g>
  </g>

  <!-- ==================== STATION 3: TRACE ==================== -->
  <g transform="translate(810, 75)">
    <!-- Box -->
    <rect width="350" height="210" rx="10" fill="#0c1018" stroke="#1e293b" stroke-width="1.2"/>
    <rect width="350" height="210" rx="10" fill="url(#card-glow)"/>
    <rect x="0" y="0" width="350" height="3" rx="1.5" fill="#00e5ff"/>

    <!-- Station Identifier -->
    <text x="24" y="34" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="12" font-weight="700" fill="#00e5ff" letter-spacing="1.5">03 // ATTRIBUTION</text>
    <text x="24" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="2">TRACE</text>

    <!-- Subtitle -->
    <text x="24" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#94a3b8">Preserve decisions &amp; causal graphs</text>

    <!-- Bullets -->
    <g transform="translate(24, 120)" font-family="'SF Mono', 'Fira Code', Consolas, monospace" font-size="11" fill="#cbd5e1">
      <circle cx="4" cy="5" r="2.5" fill="#00e5ff"/>
      <text x="18" y="9">Root-cause causal mapping</text>
      <circle cx="4" cy="30" r="2.5" fill="#00e5ff"/>
      <text x="18" y="34">Architectural decision log</text>
      <circle cx="4" cy="55" r="2.5" fill="#00e5ff"/>
      <text x="18" y="59">Preserved engineering memory</text>
    </g>

    <!-- Corner Icon Glyph: Node DAG Tree -->
    <g transform="translate(300, 48)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#1e293b" stroke-width="1"/>
      <circle cx="-10" cy="-6" r="3.5" fill="#00e5ff"/>
      <circle cx="8" cy="-10" r="3" fill="#38bdf8"/>
      <circle cx="8" cy="8" r="3" fill="#38bdf8"/>
      <line x1="-7" y1="-7" x2="5" y2="-9" stroke="#00e5ff" stroke-width="1.2"/>
      <line x1="-7" y1="-5" x2="5" y2="7" stroke="#00e5ff" stroke-width="1.2"/>
    </g>
  </g>
</svg>
